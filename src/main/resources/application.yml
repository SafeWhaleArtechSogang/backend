spring:
  application:
    name: safewhale-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safewhale}
    username: ${DB_USERNAME:safewhale}
    password: ${DB_PASSWORD:safewhale}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

app:
  external:
    google-client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-seconds: 1800
    refresh-expiration-seconds: 1209600
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./build/uploads}
    max-count: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
