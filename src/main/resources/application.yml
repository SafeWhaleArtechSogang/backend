spring:
  application:
    name: safewhale-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safewhale}
    username: ${DB_USERNAME:safewhale}
    password: ${DB_PASSWORD:safewhale}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

app:
  external:
    google-client-id: ${GOOGLE_CLIENT_ID:}
  # AI 서버(FastAPI)가 /internal/** 를 부를 때 쓰는 대칭 토큰.
  # ai-server 의 .env AGENT_TOKEN 과 같은 값이어야 한다.
  agent:
    token: ${AGENT_TOKEN:dev-agent-token}
  ai:
    # C-2 부서 판정. 이 값 미만이면 default-department-code 로 강등한다.
    department-confidence-threshold: ${AI_DEPARTMENT_CONFIDENCE_THRESHOLD:0.7}
    default-department-code: ${AI_DEFAULT_DEPARTMENT_CODE:SAFETY_CENTER}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-seconds: 1800
    refresh-expiration-seconds: 1209600
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./build/uploads}
    max-count: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
