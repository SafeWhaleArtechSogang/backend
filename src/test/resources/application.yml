spring:
  datasource:
    url: jdbc:h2:mem:safewhale;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  external:
    social-login: mock
  jwt:
    secret: c2FmZXdoYWxlLXRlc3Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXM=
    access-expiration-seconds: 1800
    refresh-expiration-seconds: 1209600
  cors:
    allowed-origins: http://localhost:5175
  file:
    upload-dir: ./build/test-uploads
    max-count: 5
